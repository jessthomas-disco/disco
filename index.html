<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISCOTIME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="stage">
      <div class="phone-shell">
        <div id="launchOverlay" class="launch-overlay hidden"></div>
        <div id="onboardingOverlay" class="onboarding-overlay hidden"></div>
        <header class="topbar">
          <button id="menuButton" class="header-icon-btn menu-icon-btn" type="button" aria-label="Menu">
            <svg class="mono-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h16"></path>
            </svg>
          </button>
          <h1><span class="logo-emoji">🪩</span> <span class="logo-text">DISCOTIME</span></h1>
          <button id="profileButton" class="header-icon-btn profile-icon-btn" type="button" aria-label="Profile">
            <svg class="mono-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.2"></circle>
              <path d="M5.5 19.2c.8-3.2 3.5-5.2 6.5-5.2s5.7 2 6.5 5.2"></path>
            </svg>
          </button>
        </header>

        <div id="drawerBackdrop" class="drawer-backdrop"></div>
        <aside id="quickMenu" class="quick-menu-drawer" role="menu" aria-label="Quick menu">
          <div class="quick-menu-head">
            <p class="quick-menu-title">Menu</p>
            <button id="closeDrawerButton" class="quick-menu-close" type="button" aria-label="Close menu">✕</button>
          </div>
          <div class="quick-menu-stack">
            <button type="button" class="quick-menu-item" data-menu-tab="tour">Home</button>
            <button type="button" class="quick-menu-item" data-menu-tab="calendar" data-calendar-view="calendar">Calendar</button>
            <button type="button" class="quick-menu-item" data-menu-tab="calendar" data-calendar-view="countdown">Countdowns</button>
            <button type="button" class="quick-menu-item" data-menu-tab="setlists">Setlists</button>
            <button type="button" class="quick-menu-item" data-menu-tab="live">Live</button>
            <button type="button" class="quick-menu-item" data-menu-tab="profile">Profile</button>
            <button type="button" class="quick-menu-item" data-menu-tab="settings">Settings</button>
          </div>
          <div class="quick-menu-footer">
            <button id="drawerAuthAction" type="button" class="quick-menu-item quick-menu-auth">Sign in</button>
          </div>
        </aside>

        <main class="content">
          <section id="view-tour" class="view"></section>
          <section id="view-calendar" class="view hidden"></section>
          <section id="view-setlists" class="view hidden"></section>
          <section id="view-live" class="view hidden"></section>
          <section id="view-profile" class="view hidden"></section>
          <section id="view-settings" class="view hidden"></section>
        </main>

        <nav id="navTabs" class="bottom-tabs" aria-label="Main navigation"></nav>

        <div id="authModal" class="modal-backdrop hidden">
          <section class="modal-card auth-modal-card">
            <button id="closeAuthModal" class="ghost auth-close-btn" type="button" aria-label="Close account">X</button>
            <div class="auth-brand">
              <div class="auth-logo-mark"><span class="logo-emoji">🪩</span></div>
              <h2 class="auth-title">DISCOTIME</h2>
              <p class="auth-subtitle">Sign in to save your shows, attendance, and favorites.</p>
            </div>

            <div id="authActions" class="auth-panel">
              <div class="switcher auth-switcher">
                <button id="modeSignIn" class="switch-pill active" type="button">Sign in</button>
                <button id="modeSignUp" class="switch-pill muted" type="button">Sign up</button>
              </div>

              <div class="auth-copy">
                <h3 id="authHeading">Sign in</h3>
                <p id="authMessage" class="meta auth-message">Welcome back to DISCOTIME.</p>
              </div>

              <form id="emailAuthForm" class="auth-form">
                <div class="form-group">
                  <label for="authEmail">Email</label>
                  <input id="authEmail" type="email" placeholder="Enter email" required />
                </div>
                <div class="form-group">
                  <label for="authPassword">Password</label>
                  <div class="password-field">
                    <input id="authPassword" type="password" placeholder="Enter password" minlength="6" required />
                    <button id="togglePasswordVisibility" class="password-toggle" type="button" aria-label="Show password">
                      <svg class="mono-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="auth-utility-row">
                  <label class="auth-checkbox">
                    <input id="rememberMeToggle" type="checkbox" />
                    <span>Remember me</span>
                  </label>
                  <button id="forgotPasswordButton" class="auth-inline-link" type="button">Forgot password?</button>
                </div>
                <button id="emailAuthSubmit" class="primary auth-submit" type="submit">Sign in</button>
              </form>

              <div class="auth-divider"><span>or continue with</span></div>

              <div class="auth-socials">
                <button id="googleAuth" class="ghost auth-social" type="button">Google</button>
                <button id="appleAuth" class="ghost auth-social" type="button">Apple</button>
              </div>
            </div>
          </section>
        </div>

        <div id="showInfoModal" class="modal-backdrop hidden">
          <section class="modal-card">
            <div class="section-head">
              <h2>SHOW INFO</h2>
              <button id="closeShowInfoModal" class="ghost" type="button" aria-label="Close show info">X</button>
            </div>
            <div id="showInfoBody" class="form-grid"></div>
          </section>
        </div>

        <div id="tonightModal" class="modal-backdrop hidden">
          <section class="modal-card">
            <div class="section-head">
              <h2>TONIGHT'S SHOW</h2>
              <button id="closeTonightModal" class="ghost" type="button" aria-label="Close tonight show hub">X</button>
            </div>
            <div id="tonightModalBody" class="form-grid"></div>
          </section>
        </div>

        <div id="reportModal" class="modal-backdrop hidden">
          <section class="modal-card">
            <div class="section-head">
              <h2>REPORT LINK</h2>
              <button id="closeReportModal" class="ghost" type="button" aria-label="Close report form">X</button>
            </div>
            <form id="reportForm" class="form-grid">
              <div class="form-group">
                <label>Reason</label>
                <select id="reportReason" name="reason" required>
                  <option value="spam">Spam</option>
                  <option value="broken_link">Broken link</option>
                  <option value="inappropriate">Inappropriate</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label>Details</label>
                <textarea id="reportDetails" name="details" placeholder="Optional details"></textarea>
              </div>
              <button id="reportSubmit" class="primary" type="submit">Send report</button>
            </form>
          </section>
        </div>

        <div id="contactModal" class="modal-backdrop hidden">
          <section class="modal-card">
            <div class="section-head">
              <h2 id="contactModalTitle">CONTACT SUPPORT</h2>
              <button id="closeContactModal" class="ghost" type="button" aria-label="Close contact form">X</button>
            </div>
            <form id="contactForm" class="form-grid">
              <div class="form-group">
                <label for="contactEmail">Email</label>
                <input id="contactEmail" name="email" type="email" placeholder="Your email" />
              </div>
              <div class="form-group">
                <label for="contactSubject">Subject</label>
                <input id="contactSubject" name="subject" type="text" placeholder="How can we help?" required />
              </div>
              <div class="form-group">
                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" name="message" placeholder="Tell us what's going on" required></textarea>
              </div>
              <button id="contactSubmit" class="primary" type="submit">Send message</button>
            </form>
          </section>
        </div>
      </div>
    </div>

    <script>
      // Local browser testing only. Leave empty in source control and set your real values locally.
      window.__SUPABASE_URL__ = "https://tnoexvjeidualbmpdvwc.supabase.co";
      window.__SUPABASE_ANON_KEY__ =  "sb_publishable_1XA_JHvYa8MpJQvgONidEA_THJw1Wbk";
    </script>
    <script src="app.js"></script>
  </body>
</html>
